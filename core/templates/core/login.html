{% extends 'base.html' %}
{% block title %}Login - Kalikote Group{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center bg-brand-50 px-4 pt-24 sm:pt-32">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-soft p-8 sm:p-10">
    <h2 class="text-2xl font-bold text-center text-brand-700 mb-6">
      Login to Kalikote
    </h2>

    <form method="post" class="flex flex-col gap-4">
      {% csrf_token %}
      {% if form.errors %}
      <p class="text-sm text-red-500 text-left">Invalid username or password</p>
      {% endif %}

      <input 
        type="text" 
        name="username" 
        placeholder="Username" 
        required 
        class="border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500"
      />

      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        required 
        class="border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500"
      />

      <button 
        type="submit" 
        class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-2xl font-semibold transition"
      >
        Login
      </button>
    </form>

  </div>
</div>
{% endblock %}
