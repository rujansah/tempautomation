    <button
      type="submit"
      class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-xl font-semibold transition"

<script>
  const coverageInput = document.querySelector("#courseCoverage");
  const tagify = new Tagify(coverageInput);

  const previewImg = document.getElementById("certificatePreview");

  function debounce(func, delay) {
    let timeout;
    return function () {
      const context = this;
      const args = arguments;

      clearTimeout(timeout);
      timeout = setTimeout(() => {
        func.apply(context, args);
      }, delay);
    };
  }

  function updatePreview() {
    const type = document.querySelector(
      "input[name='certificate_type']:checked",
    );
    if (!type) return;

    const data = {
      certificate_type: type.value,
      name: document.querySelector("[name='name']").value,
      position: document.querySelector("[name='position']").value,
      from_date: document.querySelector("[name='from_date']").value,
      to_date: document.querySelector("[name='to_date']").value,
      course_name: document.querySelector("[name='course_name']").value,
      course_outcome: document.querySelector("[name='course_outcome']").value,
      training_hours: document.querySelector("[name='training_hours']").value,
      course_coverage: tagify.value.map((t) => t.value),
      commitment_to: document.querySelector("[name='commitment_to']").value,
    };

    fetch("{% url 'certificate_preview' %}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    })
      .then((res) => res.blob())
      .then((blob) => {
        previewImg.src = URL.createObjectURL(blob);
        previewImg.classList.remove("hidden");
      })
      .catch(() => showAlert("Preview failed"));
  }

  const debouncedPreview = debounce(updatePreview, 400);

  // Ensure preview updates correctly with Tagify
  tagify.on("add", debouncedPreview);
  tagify.on("remove", debouncedPreview);
  tagify.on("edit:updated", debouncedPreview);
  tagify.on("change", debouncedPreview);

  const radios = document.querySelectorAll("input[name='certificate_type']");
  const certificateFields = document.getElementById("certificateFields");
  const positionFields = document.getElementById("positionFields");
  const courseFields = document.getElementById("courseFields");

  radios.forEach((radio) => {
    radio.addEventListener("change", () => {
      // Show the main form once a type is selected
      certificateFields.classList.remove("hidden");

      // Hide sub-fields initially
      positionFields.classList.add("hidden");
      courseFields.classList.add("hidden");

      // Show corresponding fields
      if (
        radio.value === "internship_certificate" ||
        radio.value === "employment_certificate"
      ) {
        positionFields.classList.remove("hidden");
      }

      if (radio.value === "course_certificate") {
        courseFields.classList.remove("hidden");
      }
    });
  });

  function showAlert(msg, type = "error") {
    const alert = document.getElementById("customAlert");
    const alertBox = document.getElementById("alertBox");
    const icon = document.getElementById("alertIcon");
    const message = document.getElementById("alertMessage");

    message.textContent = msg;

    // Remove previous classes
    alertBox.classList.remove(
      "bg-red-500", "bg-green-500", 
      "text-white"
    );

    if (type === "success") {
      alertBox.classList.add("bg-green-500", "text-white");
      icon.textContent = "✅";
    } else {
      alertBox.classList.add("bg-red-500", "text-white");
      icon.textContent = "⚠";
    }

    alert.classList.remove("hidden");

    setTimeout(() => {
      alert.classList.add("hidden");
    }, 4000);
  }

  const courseSelect = document.getElementById("courseSelect");

    document.querySelector("[name='training_hours']").value = data.hours;
    document.querySelector("[name='commitment_to']").value = data.commitment;

    tagify.removeAllTags();
    tagify.addTags(data.coverage);

    updatePreview();
  });

  const form = document.getElementById("certificateForm");

  const loadingOverlay = document.getElementById("loadingOverlay");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    loadingOverlay.classList.remove("hidden"); // show loader

    const formData = new FormData(form);
    formData.set(
      "course_coverage",
      JSON.stringify(tagify.value.map((t) => t.value)),
    );

    fetch("{% url 'certificate_generator' %}", {
      method: "POST",
      body: formData,
      headers: {
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
          .value,
      },
    })
      .then((res) => {
        if (!res.ok) {
          // throw a simple error to show in alert
          throw new Error("Certificate generation failed");
        }
        return res.text();
      })
      .then((msg) => {
        loadingOverlay.classList.add("hidden");
        showAlert(msg, "success"); // success alert
        setTimeout(() => location.reload(), 2000);
      })
      .catch((err) => {
        loadingOverlay.classList.add("hidden");
        showAlert(err.message, "error"); // clean error alert
      });
  });

  form.addEventListener("input", debouncedPreview);
</script>

{% endblock %}
